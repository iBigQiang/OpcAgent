name: CI

on:
  pull_request:
  push:
    branches: [main, craft-sources-auto]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 隔离运行配置
        shell: bash
        run: echo "CONFIG_DIR=$RUNNER_TEMP/opcagent-ci-config" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned Craft baseline
        run: |
          git clone --filter=blob:none https://github.com/craft-ai-agents/craft-agents-oss.git "$RUNNER_TEMP/craft-agents-oss"
          git -C "$RUNNER_TEMP/craft-agents-oss" checkout --detach a60ebc1a5a7cb0a6af7a77d5eed0512c5fc07658
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lint
        run: bun run lint
        env:
          CRAFT_AGENT_SOURCE: ${{ runner.temp }}/craft-agents-oss
      - name: Audit Craft source reuse
        run: bun run audit:craft-reuse
        env:
          CRAFT_AGENT_SOURCE: ${{ runner.temp }}/craft-agents-oss
      - name: Validate types, focused tests, document tools, and locales
        run: bun run validate:ci
      - name: Run test suite
        run: bun run test
      - name: Build WebUI
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run webui:build
      - name: Build CLI
        run: bun run cli:build
      - name: Check whitespace errors
        run: git diff --check

  package:
    name: Package ${{ matrix.target }}-${{ matrix.arch }}
    needs: quality
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            platform: darwin
            arch: arm64
          - os: windows-latest
            target: win
            platform: win32
            arch: x64
          - os: ubuntu-latest
            target: linux
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: 隔离运行配置
        shell: bash
        run: echo "CONFIG_DIR=$RUNNER_TEMP/opcagent-ci-config" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build desktop application
        env:
          OPCAGENT_AUTO_UPDATE_ENABLED: ${{ matrix.target != 'mac' }}
        run: bun run electron:build
      - name: Package desktop application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        working-directory: apps/electron
        shell: bash
        run: |
          args=(--config electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --publish never)
          if [ "${{ matrix.target }}" = "mac" ]; then
            args+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false")
          fi
          bunx electron-builder "${args[@]}"
      - name: Build headless server
        shell: bash
        run: bun run scripts/build-server.ts --output="dist/OPC-Agent-server-ci-${{ matrix.platform }}-${{ matrix.arch }}" --compress
      - name: Compress Windows headless server
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/OPC-Agent-server-ci-${{ matrix.platform }}-${{ matrix.arch }}/*" -DestinationPath "dist/OPC-Agent-server-ci-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.exe
            apps/electron/release/*.AppImage
            apps/electron/release/*.blockmap
            apps/electron/release/latest*.yml
            dist/OPC-Agent-server-*.tar.gz
            dist/OPC-Agent-server-*.zip

  update-readme:
    name: 更新当前分支的构建下载信息
    needs: [quality, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/craft-sources-auto')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      BUILD_BRANCH: ${{ github.ref_name }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 确认分支仍指向本次构建
        id: branch
        shell: bash
        run: |
          echo "CONFIG_DIR=$RUNNER_TEMP/opcagent-ci-config" >> "$GITHUB_ENV"
          echo "BUILD_METADATA=$RUNNER_TEMP/opcagent-ci-build.json" >> "$GITHUB_ENV"
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/$BUILD_BRANCH" | cut -f1)
          if [ "$remote_sha" = "$BUILD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "分支已有更新，本次跳过 README 写回，由新构建处理。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 安装依赖
        if: steps.branch.outputs.current == 'true'
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 获取当前运行的真实制品并更新 README
        if: steps.branch.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bun scripts/collect-ci-build-metadata.ts --output "$BUILD_METADATA"
          bun scripts/update-ci-readme.ts --metadata "$BUILD_METADATA"
          git diff --check
      - name: 提交 README 及其审计哈希
        if: steps.branch.outputs.current == 'true'
        shell: bash
        run: |
          if git diff --quiet -- README.md scripts/craft-source-overrides.json; then
            echo "README 构建信息已是最新，无需提交。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/$BUILD_BRANCH" | cut -f1)
          if [ "$remote_sha" != "$BUILD_SHA" ]; then
            echo "分支已有更新，本次跳过 README 写回，由新构建处理。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md scripts/craft-source-overrides.json
          git commit -m "docs: 更新验证安装包下载信息"
          if git push origin "HEAD:refs/heads/$BUILD_BRANCH"; then
            echo "已更新 $BUILD_BRANCH 分支 README 的三平台下载链接与版本说明。" >> "$GITHUB_STEP_SUMMARY"
          else
            remote_sha=$(git ls-remote --exit-code origin "refs/heads/$BUILD_BRANCH" | cut -f1)
            if [ "$remote_sha" != "$BUILD_SHA" ]; then
              echo "推送期间分支已有更新，保留新提交并跳过本次 README 写回。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::README 写回失败，请检查分支保护或 Actions 写入权限。"
            exit 1
          fi
