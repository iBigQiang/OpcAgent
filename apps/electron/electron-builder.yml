appId: app.opcagent.desktop
productName: OPC Agent
copyright: Copyright © 2026 OPC Agent contributors
electronVersion: "39.2.7"
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - "!dist/renderer/src/**"
  - "!**/*.map"
  - package.json
  - vendor/bun/**/*

extraMetadata:
  main: dist/main.cjs

extraResources:
  - from: ../../node_modules/@vscode/ripgrep/bin
    to: app/node_modules/@vscode/ripgrep/bin
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
    to: messaging-whatsapp-worker/worker.cjs

publish:
  provider: github
  owner: iBigQiang
  repo: OpcAgent

asar: false

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  extendInfo:
    CFBundleIconName: AppIcon
    CFBundleURLTypes:
      - CFBundleURLName: app.opcagent.desktop
        CFBundleURLSchemes:
          - opcagent
    NSLocalNetworkUsageDescription: OPC Agent uses the local network to reach local models, servers, and devices requested by the user.
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: OPC-Agent-${version}-${arch}.${ext}

dmg:
  artifactName: OPC-Agent-${version}-${arch}.dmg
  icon: resources/icon.icns
  iconSize: 80
  title: OPC Agent
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: OPC-Agent-${version}-${arch}.${ext}
  files:
    - "!vendor/bun/**/*"
  extraResources:
    - from: vendor/bun/bun.exe
      to: vendor/bun/bun.exe
  protocols:
    - name: OPC Agent
      schemes: [opcagent]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: true

linux:
  icon: resources/icon.png
  category: Utility
  maintainer: OPC Agent contributors
  target:
    - AppImage
  artifactName: OPC-Agent-${version}-${arch}.${ext}
  protocols:
    - name: OPC Agent
      schemes: [opcagent]
